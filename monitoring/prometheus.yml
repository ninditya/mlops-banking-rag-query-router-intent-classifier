global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'banking-router'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'intent-router'
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
