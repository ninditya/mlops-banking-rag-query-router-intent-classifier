name: CI - Training + Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'workflow_ci/**'
      - 'eksperimen/banking77_preprocessing/**'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workflow_ci
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mlflow==2.16.2 scikit-learn==1.5.1 pandas==2.2.2 \
            numpy==1.26.4 matplotlib==3.9.0 seaborn==0.13.2 \
            sentence-transformers==5.5.0 transformers==5.8.1 \
            torch==2.12.0 tokenizers==0.22.2 huggingface_hub==1.15.0 \
            pillow==12.2.0 tqdm==4.67.3

      - name: Copy preprocessed data
        run: |
          mkdir -p banking77_preprocessing
          cp -r ../eksperimen/banking77_preprocessing/* banking77_preprocessing/ 2>/dev/null || true

      - name: Run MLflow training
        run: mlflow run . --env-manager=local

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: workflow_ci/artifacts/
        continue-on-error: true

      - name: Get run_id
        id: get_run
        run: |
          if [ ! -f mlflow_run_id.txt ]; then
            echo "mlflow_run_id.txt tidak ditemukan"
            exit 1
          fi
          echo "RUN_ID=$(cat mlflow_run_id.txt)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3
        if: env.DOCKERHUB_USERNAME != ''

      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          mlflow models build-docker \
            -m "runs:/${{ steps.get_run.outputs.RUN_ID }}/model" \
            -n "${{ secrets.DOCKERHUB_USERNAME }}/banking-router:latest"
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-router:latest
