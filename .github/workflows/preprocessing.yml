name: Preprocessing Banking77

on:
  push:
    paths:
      - 'eksperimen/automate_*.py'
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas scikit-learn "datasets==2.21.0" tqdm huggingface_hub

      - name: Run preprocessing
        run: |
          cd eksperimen
          python automate_NindityaS.py \
            --input huggingface \
            --output banking77_preprocessing

      - name: Upload preprocessed dataset
        uses: actions/upload-artifact@v4
        with:
          name: banking77-preprocessed
          path: eksperimen/banking77_preprocessing/
